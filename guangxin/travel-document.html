<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出差申请单</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f3f5;font:14px "Microsoft YaHei",sans-serif;color:#28384b}header{background:#4385ff;color:white;text-align:center;padding:17px;font-weight:600}main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;max-width:1500px;margin:24px auto;padding:0 24px}.document{background:white;padding:30px;box-shadow:0 2px 12px #20324b12}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border:1px solid #edf1f6;padding:20px}.summary small{display:block;color:#8b98ab;margin-top:7px}.section{border:1px solid #edf1f6;padding:22px;margin-top:20px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.field{display:flex;align-items:center;gap:12px}.field span{color:#7e8da2;font-size:12px;white-space:nowrap}.field b{background:#f2f5fa;padding:10px;flex:1;font-size:13px;font-weight:400}.wide{grid-column:1/-1}h3{font-size:14px;border-left:4px solid #4385ff;padding-left:10px;margin:25px 0 16px}aside{background:white;padding:20px}.node{padding:17px;background:#f5f7fb;margin:12px 0;border-radius:5px}.node small{display:block;color:#8a99ac;margin-top:10px}footer{padding:18px;text-align:center;background:#fff5cf}button{padding:9px 17px;background:white;border:1px solid #cfddf3;border-radius:5px;color:#347cf4;cursor:pointer}p{line-height:1.8;color:#8a99ac}@media(max-width:900px){main{grid-template-columns:1fr}.fields,.summary{grid-template-columns:1fr 1fr}}</style></head><body><header>GHG-出差申请单</header><main><article class="document" id="tripDocument"></article><aside><h3>基本信息 · 审批流程</h3><div id="tripFlow"></div><p>此页面为原型单据详情演示，尚未接入财务系统。</p></aside></main><footer id="tripTotal"></footer><script src="brief-travel.js"></script><script>
const r=BriefTravel.allRecords.find(r=>r.id===new URLSearchParams(location.search).get('id'));if(!r){document.querySelector('#tripDocument').textContent='未找到该单据，请返回来源列表。'}else{document.title=r.id+' · 出差申请单';const field=(k,v,wide=false)=>'<div class="field '+(wide?'wide':'')+'"><span>'+k+'</span><b>'+v+'</b></div>';document.querySelector('#tripDocument').innerHTML='<div class="summary">'+[[r.id,'单据编号'],[r.date,'单据日期'],[r.applicant,'申请人'],['出差申请','业务类型']].map(([v,k])=>'<div><b>'+v+'</b><small>'+k+'</small></div>').join('')+'</div><section class="section fields">'+field('申请人',r.applicant)+field('核算主体',r.company)+field('业务类型','出差申请')+field('申请费用（含补贴）',r.amount)+field('本位币币种','人民币')+field('报账币种','人民币')+field('本次申请金额',r.amount)+field('用车制度','差旅用车')+field('审批状态',r.status)+field('备注',r.summary,true)+'</section><h3>申请明细</h3><section class="section fields">'+field('出行人员',r.applicant)+field('是否国内差旅','国内')+field('出发城市',r.departure)+field('开始日期',r.start)+field('结束日期',r.end)+field('途经及目的地',r.destination)+'</section><h3>附件区</h3><p>暂无附件</p>';document.querySelector('#tripFlow').innerHTML=[['开始',r.applicant],['部门负责人','已完成'],['财务审核','已完成'],['结束',r.status]].map(([k,v])=>'<div class="node"><b>'+k+'</b><small>'+v+'</small></div>').join('');document.querySelector('#tripTotal').textContent='申请费用（含补贴） ¥'+r.amount;}
</script></body></html>
